[package]
name = "h5i-error"
version = "0.2.8"
edition = "2024"
description = "Shared error type for the h5i workspace (temporal/intentional/empirical/associative categories)."

[features]
default = ["git"]
git = ["dep:git2"]

[dependencies]
thiserror = { workspace = true }
git2 = { workspace = true, optional = true }
serde_json = { workspace = true }
toml = { workspace = true }
